<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In - Clininfo</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

</head>


<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">


    <!-- Header -->

    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">

        <a
            href="/"
            class="inline-flex items-center gap-2 text-2xl font-bold text-blue-600">

            <i
                data-lucide="activity"
                class="w-8 h-8">
            </i>

            <span>Clininfo</span>

        </a>


        <h2 class="mt-4 text-2xl font-bold text-slate-900">
            Sign in to your account
        </h2>


        <p class="mt-1 text-sm text-slate-600">

            New to Clininfo?

            <a
                href="/register"
                class="font-medium text-blue-600 hover:underline">

                Create an account

            </a>

        </p>

    </div>



    <!-- Login Card -->

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">

        <div class="bg-white py-8 px-6 shadow border border-slate-200 rounded-xl sm:px-10">


            <!-- Error Alert -->

            <div
                id="error-alert"
                class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg flex items-center gap-2">

                <i
                    data-lucide="alert-circle"
                    class="w-4 h-4 shrink-0">
                </i>

                <span id="error-message">
                    Invalid email or password.
                </span>

            </div>



            <!-- Login Form -->

            <form
                id="login-form"
                class="space-y-4">


                <!-- Email -->

                <div>

                    <label
                        for="email"
                        class="block text-xs font-semibold uppercase text-slate-500 mb-1">

                        Email Address

                    </label>


                    <div class="relative">

                        <i
                            data-lucide="mail"
                            class="w-4 h-4 text-slate-400 absolute left-3 top-3.5">
                        </i>


                        <input
                            type="email"
                            id="email"
                            required
                            placeholder="john@example.com"
                            class="w-full border border-slate-300 rounded-lg pl-9 p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">

                    </div>

                </div>



                <!-- Password -->

                <div>

                    <label
                        for="password"
                        class="block text-xs font-semibold uppercase text-slate-500 mb-1">

                        Password

                    </label>


                    <div class="relative">

                        <i
                            data-lucide="lock"
                            class="w-4 h-4 text-slate-400 absolute left-3 top-3.5">
                        </i>


                        <input
                            type="password"
                            id="password"
                            required
                            placeholder="......"
                            class="w-full border border-slate-300 rounded-lg pl-9 p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">

                    </div>

                </div>



                <!-- Sign In Button -->

                <button
                    type="submit"
                    id="submit-btn"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium p-2.5 rounded-lg shadow transition disabled:opacity-50 mt-2 flex items-center justify-center gap-2">

                    <span>
                        Sign In
                    </span>

                </button>

            </form>

        </div>

    </div>



    <!-- Firebase configuration generated by FastAPI/Jinja2 -->

    <script
        id="firebase-config"
        type="application/json">{{ firebase_config_json | safe }}</script>



    <!-- Login JavaScript -->

    <script type="module">


        // Firebase initialization

        import {
            initFirebase
        } from "/static/js/firebase-init.js";


        // Firebase Authentication

        import {
            signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";



        // Get Firebase configuration

        const configElement =
            document.getElementById("firebase-config");


        const config =
            JSON.parse(configElement.textContent);



        // Initialize Firebase

        const {
            auth
        } = initFirebase(config);



        // Initialize Lucide icons

        lucide.createIcons();



        // Get DOM elements

        const form =
            document.getElementById("login-form");


        const errorAlert =
            document.getElementById("error-alert");


        const submitBtn =
            document.getElementById("submit-btn");



        // Handle login

        form.addEventListener("submit", async (e) => {

            e.preventDefault();


            // Hide previous error

            errorAlert.classList.add("hidden");


            // Disable button

            submitBtn.disabled = true;


            submitBtn.innerHTML = `
                <i
                    data-lucide="loader"
                    class="w-4 h-4 animate-spin">
                </i>
                Signing in...
            `;


            lucide.createIcons();



            // Get form values

            const email =
                document.getElementById("email").value.trim();


            const password =
                document.getElementById("password").value;



            try {


                // Sign in with Firebase Authentication

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


                // Login successful

                window.location.href =
                    "/dashboard";


            }


            catch (err) {


                console.error(
                    "Login error:",
                    err
                );


                // Show error

                errorAlert.classList.remove("hidden");


                // Enable button

                submitBtn.disabled = false;


                submitBtn.innerHTML = `
                    <span>
                        Sign In
                    </span>
                `;


                lucide.createIcons();

            }

        });

    </script>

</body>

</html>
