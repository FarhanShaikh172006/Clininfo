<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Clininfo</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>


<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col">


    <!-- Header Navigation -->

    <header class="bg-white border-b sticky top-0 z-50">

        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">

            <div class="flex items-center gap-6">

                <a
                    href="/"
                    class="flex items-center gap-2 text-xl font-bold text-blue-600">

                    <i
                        data-lucide="activity"
                        class="w-6 h-6">
                    </i>

                    <span>Clininfo</span>

                </a>


                <!-- Navigation Bar -->

                <nav class="hidden md:flex items-center gap-2">

                    <a
                        href="/dashboard"
                        class="text-xs font-semibold px-3 py-2 rounded-lg bg-blue-50 text-blue-600 border border-blue-200 flex items-center gap-1.5">

                        <i
                            data-lucide="calendar"
                            class="w-4 h-4 text-blue-600">
                        </i>

                        <span>Appointments</span>

                    </a>

                    <a
                        href="/blood-bank"
                        class="text-xs font-semibold px-3 py-2 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition flex items-center gap-1.5">

                        <i
                            data-lucide="droplet"
                            class="w-4 h-4 text-rose-500">
                        </i>

                        <span>Blood Bank</span>

                    </a>

                    <a
                        href="/emergency"
                        class="text-xs font-semibold px-3 py-2 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition flex items-center gap-1.5">

                        <i
                            data-lucide="siren"
                            class="w-4 h-4 text-red-500">
                        </i>

                        <span>Emergency SOS</span>

                    </a>

                    <a
                        href="/admin"
                        class="text-xs font-semibold px-3 py-2 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition flex items-center gap-1.5">

                        <i
                            data-lucide="shield-alert"
                            class="w-4 h-4 text-amber-500">
                        </i>

                        <span>Admin Center</span>

                    </a>

                </nav>

            </div>


            <div class="flex items-center gap-4">

                <!-- Emergency Quick Trigger Button -->

                <a
                    href="/emergency"
                    class="text-xs bg-red-600 hover:bg-red-700 text-white font-bold px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 shadow-sm">

                    <i
                        data-lucide="siren"
                        class="w-4 h-4 animate-pulse">
                    </i>

                    <span>SOS</span>

                </a>


                <div
                    id="user-info"
                    class="flex items-center gap-2 text-sm text-slate-700">

                    <div
                        id="user-avatar"
                        class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold">

                        ?

                    </div>

                    <span
                        id="user-name"
                        class="font-medium">

                        Loading...

                    </span>

                    <span
                        id="user-role"
                        class="text-xs px-2 py-0.5 bg-slate-100 text-slate-600 rounded-full capitalize">

                        patient

                    </span>

                </div>


                <button
                    id="logout-btn"
                    class="text-sm text-red-600 hover:text-red-700 px-3 py-1.5 rounded-md hover:bg-red-50 border border-red-200 flex items-center gap-1">

                    <i
                        data-lucide="log-out"
                        class="w-4 h-4">
                    </i>

                    <span>Logout</span>

                </button>

            </div>

        </div>

    </header>



    <!-- Main Content -->

    <main
        class="flex-1 max-w-7xl w-full mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">


        <!-- Appointment Booking -->

        <section
            class="lg:col-span-1 bg-white p-6 rounded-xl border border-slate-200 shadow-sm h-fit">

            <h2
                class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">

                <i
                    data-lucide="calendar-plus"
                    class="w-5 h-5 text-blue-600">
                </i>

                <span>Book Appointment</span>

            </h2>


            <!-- Booking Alert -->

            <div
                id="booking-alert"
                class="hidden mb-4 p-3 text-xs rounded-lg flex items-center gap-2">

                <span id="booking-msg"></span>

            </div>


            <!-- Booking Form -->

            <form
                id="appointment-form"
                class="space-y-4">


                <!-- Department -->

                <div>

                    <label
                        for="department"
                        class="block text-xs font-semibold uppercase text-slate-500 mb-1">

                        Doctor / Department

                    </label>


                    <select
                        id="department"
                        required
                        class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">

                        <option value="General Physician">
                            General Physician
                        </option>

                        <option value="Cardiology">
                            Cardiology
                        </option>

                        <option value="Dermatology">
                            Dermatology
                        </option>

                        <option value="Pediatrics">
                            Pediatrics
                        </option>

                        <option value="Orthopedics">
                            Orthopedics
                        </option>

                    </select>

                </div>



                <!-- Date -->

                <div>

                    <label
                        for="app-date"
                        class="block text-xs font-semibold uppercase text-slate-500 mb-1">

                        Preferred Date

                    </label>


                    <input
                        type="date"
                        id="app-date"
                        required
                        class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">

                </div>



                <!-- Time -->

                <div>

                    <label
                        for="app-time"
                        class="block text-xs font-semibold uppercase text-slate-500 mb-1">

                        Preferred Time

                    </label>


                    <input
                        type="time"
                        id="app-time"
                        required
                        class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">

                </div>



                <!-- Symptoms -->

                <div>

                    <label
                        for="symptoms"
                        class="block text-xs font-semibold uppercase text-slate-500 mb-1">

                        Symptoms / Reason

                    </label>


                    <textarea
                        id="symptoms"
                        rows="3"
                        required
                        placeholder="Describe your health condition..."
                        class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>

                </div>



                <!-- Book Button -->

                <button
                    type="submit"
                    id="book-btn"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium p-2.5 rounded-lg shadow transition flex items-center justify-center gap-2">

                    <i
                        data-lucide="check-circle"
                        class="w-4 h-4">
                    </i>

                    <span>Confirm Booking</span>

                </button>

            </form>

        </section>



        <!-- Appointment History -->

        <section
            class="lg:col-span-2 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">

            <h2
                class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">

                <i
                    data-lucide="clock"
                    class="w-5 h-5 text-blue-600">
                </i>

                <span>Your Appointments</span>

            </h2>


            <!-- Loading -->

            <div
                id="appointments-loading"
                class="py-12 text-center text-slate-500 flex flex-col items-center justify-center gap-2">

                <i
                    data-lucide="loader"
                    class="w-6 h-6 animate-spin text-blue-600">
                </i>

                <span>
                    Fetching appointments from Firestore...
                </span>

            </div>



            <!-- Empty -->

            <div
                id="appointments-empty"
                class="hidden py-12 text-center text-slate-500">

                <i
                    data-lucide="calendar-x"
                    class="w-12 h-12 mx-auto text-slate-300 mb-2">
                </i>

                <p>
                    No appointments found. Book your first consultation!
                </p>

            </div>



            <!-- Appointment List -->

            <div
                id="appointments-list"
                class="space-y-3 hidden">

                <!-- Appointment cards inserted here -->

            </div>

        </section>

    </main>



    <!-- Firebase Configuration -->

    <script
        id="firebase-config"
        type="application/json">{{ firebase_config_json | safe }}</script>



    <!-- Firebase + Dashboard JavaScript -->

    <script type="module">

        // Firebase initialization

        import {
            initFirebase
        } from "/static/js/firebase-init.js";


        // Firebase Authentication

        import {
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";


        // Firebase Firestore

        import {
            doc,
            getDoc,
            collection,
            addDoc,
            query,
            where,
            onSnapshot
        } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";



        // Get Firebase configuration

        const configElement =
            document.getElementById("firebase-config");


        const config =
            JSON.parse(configElement.textContent);



        // Initialize Firebase

        const {
            auth,
            db
        } = initFirebase(config);



        // Initialize Lucide icons

        lucide.createIcons();



        // Current user variables

        let currentUser = null;
        let userProfile = null;



        // ==========================================
        // 1. AUTH GUARD
        // ==========================================

        onAuthStateChanged(auth, async (user) => {

            // User is not logged in

            if (!user) {

                window.location.href = "/login";

                return;

            }


            currentUser = user;



            // ==========================================
            // Fetch User Profile
            // ==========================================

            try {

                const userDoc =
                    await getDoc(
                        doc(
                            db,
                            "users",
                            user.uid
                        )
                    );


                if (userDoc.exists()) {

                    userProfile =
                        userDoc.data();


                    const displayName =
                        userProfile.fullName ||
                        user.email ||
                        "User";


                    document.getElementById(
                        "user-name"
                    ).textContent =
                        displayName;


                    document.getElementById(
                        "user-avatar"
                    ).textContent =
                        displayName[0].toUpperCase();


                    document.getElementById(
                        "user-role"
                    ).textContent =
                        userProfile.role ||
                        "patient";

                } else {

                    document.getElementById(
                        "user-name"
                    ).textContent =
                        user.email || "User";

                }


            } catch (err) {

                console.error(
                    "Error fetching profile:",
                    err
                );

            }



            // Listen to appointments

            listenToAppointments(user.uid);

        });



        // ==========================================
        // 2. LOGOUT
        // ==========================================

        document
            .getElementById("logout-btn")
            .addEventListener(
                "click",
                async () => {

                    try {

                        await signOut(auth);

                        window.location.href =
                            "/login";

                    } catch (err) {

                        console.error(
                            "Logout error:",
                            err
                        );

                    }

                }
            );



        // ==========================================
        // 3. BOOK APPOINTMENT
        // ==========================================

        const form =
            document.getElementById(
                "appointment-form"
            );


        const alertBox =
            document.getElementById(
                "booking-alert"
            );


        const alertMsg =
            document.getElementById(
                "booking-msg"
            );


        const bookButton =
            document.getElementById(
                "book-btn"
            );



        form.addEventListener(
            "submit",
            async (e) => {

                e.preventDefault();


                if (!currentUser) {

                    return;

                }



                const department =
                    document.getElementById(
                        "department"
                    ).value;


                const date =
                    document.getElementById(
                        "app-date"
                    ).value;


                const time =
                    document.getElementById(
                        "app-time"
                    ).value;


                const symptoms =
                    document.getElementById(
                        "symptoms"
                    ).value.trim();



                // Disable button

                bookButton.disabled = true;

                bookButton.innerHTML = `
                    <i
                        data-lucide="loader"
                        class="w-4 h-4 animate-spin">
                    </i>

                    <span>Booking...</span>
                `;

                lucide.createIcons();



                try {

                    await addDoc(
                        collection(
                            db,
                            "appointments"
                        ),
                        {

                            patientId:
                                currentUser.uid,

                            patientName:
                                userProfile
                                    ? userProfile.fullName
                                    : currentUser.email,

                            department:
                                department,

                            date:
                                date,

                            time:
                                time,

                            symptoms:
                                symptoms,

                            status:
                                "pending",

                            createdAt:
                                new Date().toISOString()

                        }
                    );



                    // Success message

                    alertBox.className =
                        "mb-4 p-3 text-xs rounded-lg bg-emerald-50 text-emerald-800 border border-emerald-200 block";


                    alertMsg.textContent =
                        "Appointment booked successfully!";


                    form.reset();



                } catch (err) {

                    console.error(
                        "Error booking appointment:",
                        err
                    );


                    alertBox.className =
                        "mb-4 p-3 text-xs rounded-lg bg-red-50 text-red-800 border border-red-200 block";


                    alertMsg.textContent =
                        "Failed to book appointment. Try again.";

                }


                // Re-enable button

                bookButton.disabled = false;


                bookButton.innerHTML = `
                    <i
                        data-lucide="check-circle"
                        class="w-4 h-4">
                    </i>

                    <span>Confirm Booking</span>
                `;

                lucide.createIcons();

            }
        );



        // ==========================================
        // 4. REAL-TIME APPOINTMENTS
        // ==========================================

        function listenToAppointments(uid) {

            const q =
                query(
                    collection(
                        db,
                        "appointments"
                    ),

                    where(
                        "patientId",
                        "==",
                        uid
                    )
                );



            onSnapshot(
                q,
                (snapshot) => {

                    const loading =
                        document.getElementById(
                            "appointments-loading"
                        );


                    const empty =
                        document.getElementById(
                            "appointments-empty"
                        );


                    const list =
                        document.getElementById(
                            "appointments-list"
                        );



                    // Hide loading

                    loading.classList.add(
                        "hidden"
                    );



                    // No appointments

                    if (snapshot.empty) {

                        empty.classList.remove(
                            "hidden"
                        );

                        list.classList.add(
                            "hidden"
                        );

                        return;

                    }



                    // Show appointments

                    empty.classList.add(
                        "hidden"
                    );

                    list.classList.remove(
                        "hidden"
                    );


                    list.innerHTML = "";



                    snapshot.forEach(
                        (appointmentDoc) => {

                            const data =
                                appointmentDoc.data();



                            // Status styling

                            const statusColor =
                                data.status === "confirmed"

                                    ? "bg-emerald-100 text-emerald-800 border-emerald-200"

                                    : data.status === "cancelled"

                                    ? "bg-red-100 text-red-800 border-red-200"

                                    : "bg-amber-100 text-amber-800 border-amber-200";



                            // Create card

                            const card =
                                document.createElement(
                                    "div"
                                );


                            card.className =
                                "p-4 border border-slate-200 rounded-xl bg-slate-50 flex items-center justify-between";



                            card.innerHTML = `

                                <div>

                                    <div
                                        class="flex items-center gap-2 mb-1">

                                        <span
                                            class="font-bold text-slate-900">

                                            ${data.department || "General Physician"}

                                        </span>


                                        <span
                                            class="text-xs px-2 py-0.5 rounded-full border ${statusColor} capitalize font-semibold">

                                            ${data.status || "pending"}

                                        </span>

                                    </div>


                                    <p
                                        class="text-xs text-slate-600 flex items-center gap-3">

                                        <span>

                                            <i
                                                data-lucide="calendar"
                                                class="w-3.5 h-3.5 inline">
                                            </i>

                                            ${data.date || "Not specified"}

                                        </span>


                                        <span>

                                            <i
                                                data-lucide="clock"
                                                class="w-3.5 h-3.5 inline">
                                            </i>

                                            ${data.time || "Not specified"}

                                        </span>

                                    </p>


                                    <p
                                        class="text-xs text-slate-500 mt-1 italic">

                                        "${data.symptoms || "No symptoms provided"}"

                                    </p>

                                </div>

                            `;


                            list.appendChild(card);

                        }
                    );



                    // Refresh icons

                    lucide.createIcons();

                },



                (error) => {

                    console.error(
                        "Appointment listener error:",
                        error
                    );

                    document.getElementById(
                        "appointments-loading"
                    ).classList.add("hidden");

                }

            );

        }

    </script>

</body>

</html>
