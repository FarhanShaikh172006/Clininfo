<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Hospital Finder & Map - Clininfo</title>


    <!-- Tailwind CSS -->

    <script src="https://cdn.tailwindcss.com"></script>


    <!-- Lucide Icons -->

    <script src="https://unpkg.com/lucide@latest"></script>


    <!-- Leaflet CSS -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


    <!-- Leaflet JS -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <style>

        #hospital-map {
            z-index: 10;
            border-radius: 1.25rem;
        }

        .leaflet-tile {
            filter:
                brightness(0.6)
                invert(1)
                contrast(3)
                hue-rotate(200deg)
                saturate(0.3)
                brightness(0.7);
        }

    </style>

</head>


<body
    class="h-full bg-slate-950 text-slate-100 font-sans antialiased flex flex-col">


    <!-- ========================================== -->
    <!-- Header -->
    <!-- ========================================== -->

    <header
        class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-40">


        <!-- Logo -->

        <div class="flex items-center gap-3">

            <div
                class="p-2.5 bg-blue-600/20 text-blue-400 rounded-xl border border-blue-500/30">

                <i
                    data-lucide="map-pin"
                    class="w-6 h-6">
                </i>

            </div>


            <div>

                <h1 class="font-bold text-lg text-white">
                    Find Nearby Hospitals
                </h1>

                <p class="text-xs text-slate-400">
                    Search locations or browse healthcare centers on the map
                </p>

            </div>

        </div>



        <!-- Search -->

        <div class="flex-1 max-w-xl">

            <form
                id="search-form"
                class="relative flex items-center">


                <i
                    data-lucide="search"
                    class="w-4 h-4 text-slate-400 absolute left-3.5 pointer-events-none">
                </i>


                <input
                    type="text"
                    id="search-input"
                    placeholder="Search hospital name, area, or city..."
                    class="w-full bg-slate-950 border border-slate-700 text-slate-100 text-xs pl-10 pr-24 py-2.5 rounded-xl focus:outline-none focus:border-blue-500 transition placeholder:text-slate-500">


                <button
                    type="submit"
                    class="absolute right-1.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs px-3 py-1.5 rounded-lg transition">

                    Search

                </button>

            </form>

        </div>



        <!-- Location -->

        <button
            id="location-btn"
            class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-2 rounded-xl transition flex items-center gap-2">

            <i
                data-lucide="locate-fixed"
                class="w-4 h-4 text-blue-400">
            </i>

            My Location

        </button>

    </header>



    <!-- ========================================== -->
    <!-- Main -->
    <!-- ========================================== -->

    <main
        class="flex-1 p-6 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-3 gap-6 overflow-hidden">


        <!-- ====================================== -->
        <!-- Map -->
        <!-- ====================================== -->

        <div class="lg:col-span-2 flex flex-col space-y-3">

            <div class="flex items-center justify-between">

                <span
                    class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">

                    <i
                        data-lucide="map"
                        class="w-4 h-4 text-blue-400">
                    </i>

                    Map View

                </span>


                <span
                    id="map-status"
                    class="text-xs text-slate-400 bg-slate-900 border border-slate-800 px-3 py-1 rounded-full">

                    Showing all hospitals

                </span>

            </div>


            <div
                id="hospital-map"
                class="w-full h-[550px] bg-slate-900 border border-slate-800 shadow-2xl">
            </div>

        </div>



        <!-- ====================================== -->
        <!-- Hospital Directory -->
        <!-- ====================================== -->

        <div class="lg:col-span-1 flex flex-col space-y-3">

            <span
                class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">

                <i
                    data-lucide="building-2"
                    class="w-4 h-4 text-blue-400">
                </i>

                Hospitals Directory

            </span>


            <div
                id="hospitals-list"
                class="flex-1 overflow-y-auto space-y-3 pr-1 max-h-[550px]">

            </div>

        </div>

    </main>



    <!-- ========================================== -->
    <!-- JavaScript -->
    <!-- ========================================== -->

    <script>

        let map = null;

        let markers = [];

        let userMarker = null;



        // ==========================================
        // Page Initialization
        // ==========================================

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                lucide.createIcons();

                initMap();

                loadHospitals();

            }
        );



        // ==========================================
        // Initialize Map
        // ==========================================

        function initMap() {

            map =
                L.map(
                    "hospital-map"
                ).setView(
                    [19.0760, 72.8777],
                    12
                );


            L.tileLayer(
                "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                {
                    maxZoom: 19,

                    attribution:
                        "&copy; OpenStreetMap contributors"
                }
            ).addTo(map);

        }



        // ==========================================
        // Load Hospitals
        // ==========================================

        function loadHospitals(query = "") {

            const url =
                query
                    ? `/api/hospitals/search?q=${encodeURIComponent(query)}`
                    : "/api/hospitals/search";


            fetch(url)

                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            `HTTP error: ${response.status}`
                        );

                    }

                    return response.json();

                })

                .then(data => {

                    if (data.status === "success") {

                        renderMapMarkers(data.data);

                        renderHospitalsList(data.data);

                    }

                })

                .catch(error => {

                    console.error(
                        "Hospital search error:",
                        error
                    );

                    document.getElementById(
                        "map-status"
                    ).textContent =
                        "Unable to load hospitals";

                });

        }



        // ==========================================
        // Search
        // ==========================================

        document
            .getElementById("search-form")
            .addEventListener(
                "submit",
                event => {

                    event.preventDefault();


                    const query =
                        document
                            .getElementById("search-input")
                            .value
                            .trim();


                    document.getElementById(
                        "map-status"
                    ).textContent =
                        query
                            ? `Results for "${query}"`
                            : "Showing all hospitals";


                    loadHospitals(query);

                }
            );



        // ==========================================
        // User Location
        // ==========================================

        document
            .getElementById("location-btn")
            .addEventListener(
                "click",
                getUserLocation
            );


        function getUserLocation() {

            if (!navigator.geolocation) {

                alert(
                    "Geolocation is not supported by your browser."
                );

                return;

            }


            navigator.geolocation.getCurrentPosition(

                position => {

                    const lat =
                        position.coords.latitude;

                    const lng =
                        position.coords.longitude;


                    map.setView(
                        [lat, lng],
                        14
                    );


                    if (userMarker) {

                        userMarker.setLatLng(
                            [lat, lng]
                        );

                    } else {

                        userMarker =
                            L.circleMarker(
                                [lat, lng],
                                {
                                    radius: 8,
                                    fillColor: "#3b82f6",
                                    color: "#ffffff",
                                    weight: 2,
                                    fillOpacity: 1
                                }
                            )
                            .addTo(map)
                            .bindPopup(
                                "<b>Your Current Location</b>"
                            )
                            .openPopup();

                    }

                },

                error => {

                    console.error(
                        "Location error:",
                        error
                    );

                    alert(
                        "Unable to access your location."
                    );

                }

            );

        }



        // ==========================================
        // Render Map Markers
        // ==========================================

        function renderMapMarkers(hospitals) {

            // Remove old markers

            markers.forEach(
                marker => map.removeLayer(marker)
            );


            markers = [];


            if (
                !hospitals ||
                hospitals.length === 0
            ) {

                return;

            }


            const bounds = [];


            hospitals.forEach(
                hospital => {

                    const marker =
                        L.marker(
                            [
                                hospital.latitude,
                                hospital.longitude
                            ]
                        )
                        .addTo(map);


                    marker.bindPopup(`

                        <div
                            style="
                                color: #0f172a;
                                font-family: sans-serif;
                            ">

                            <b
                                style="font-size: 13px;">

                                ${hospital.name}

                            </b>

                            <br>

                            <span
                                style="
                                    font-size: 11px;
                                    color: #475569;
                                ">

                                ${hospital.address}

                            </span>

                            <br>

                            <a
                                href="tel:${hospital.contact}"
                                style="
                                    display: inline-block;
                                    margin-top: 4px;
                                    font-size: 11px;
                                    color: #2563eb;
                                    font-weight: bold;
                                ">

                                Call: ${hospital.contact}

                            </a>

                        </div>

                    `);


                    markers.push(marker);


                    bounds.push(
                        [
                            hospital.latitude,
                            hospital.longitude
                        ]
                    );

                }
            );


            if (bounds.length > 0) {

                map.fitBounds(
                    bounds,
                    {
                        padding: [50, 50]
                    }
                );

            }

        }



        // ==========================================
        // Render Hospital List
        // ==========================================

        function renderHospitalsList(hospitals) {

            const container =
                document.getElementById(
                    "hospitals-list"
                );


            if (
                !hospitals ||
                hospitals.length === 0
            ) {

                container.innerHTML = `

                    <div
                        class="p-8 text-center text-slate-500 text-xs">

                        No medical facilities matched
                        your search criteria.

                    </div>

                `;

                return;

            }


            container.innerHTML =
                hospitals.map(
                    hospital => `

                    <div
                        class="
                            bg-slate-900
                            border
                            border-slate-800
                            hover:border-blue-500/50
                            rounded-2xl
                            p-4
                            transition
                            space-y-3
                        ">

                        <div
                            class="flex items-start justify-between gap-2">

                            <div>

                                <h4
                                    class="font-bold text-sm text-white">

                                    ${hospital.name}

                                </h4>


                                <p
                                    class="
                                        text-xs
                                        text-slate-400
                                        leading-tight
                                        mt-0.5
                                    ">

                                    ${hospital.address}

                                </p>

                            </div>


                            <span
                                class="
                                    text-[10px]
                                    bg-slate-800
                                    text-slate-300
                                    px-2
                                    py-0.5
                                    rounded-full
                                    border
                                    border-slate-700
                                    shrink-0
                                ">

                                ${hospital.type || "Hospital"}

                            </span>

                        </div>



                        <div
                            class="flex items-center gap-2 pt-1">


                            <!-- View Map -->

                            <button
                                onclick="
                                    focusMap(
                                        ${hospital.latitude},
                                        ${hospital.longitude}
                                    )
                                "
                                class="
                                    flex-1
                                    bg-slate-800
                                    hover:bg-slate-700
                                    text-slate-200
                                    font-semibold
                                    text-xs
                                    py-2
                                    rounded-xl
                                    border
                                    border-slate-700
                                    transition
                                    flex
                                    items-center
                                    justify-center
                                    gap-1.5
                                ">

                                <i
                                    data-lucide="map-pin"
                                    class="w-3.5 h-3.5 text-blue-400">
                                </i>

                                View Map

                            </button>



                            <!-- Directions -->

                            <a
                                href="
                                    https://www.google.com/maps/dir/?api=1&destination=${hospital.latitude},${hospital.longitude}
                                "
                                target="_blank"
                                rel="noopener noreferrer"
                                class="
                                    flex-1
                                    bg-blue-600
                                    hover:bg-blue-500
                                    text-white
                                    font-semibold
                                    text-xs
                                    py-2
                                    rounded-xl
                                    transition
                                    flex
                                    items-center
                                    justify-center
                                    gap-1.5
                                ">

                                <i
                                    data-lucide="navigation"
                                    class="w-3.5 h-3.5">
                                </i>

                                Directions

                            </a>

                        </div>

                    </div>

                `
                )
                .join("");


            lucide.createIcons();

        }



        // ==========================================
        // Focus Map
        // ==========================================

        function focusMap(lat, lng) {

            map.setView(
                [lat, lng],
                16
            );


            markers.forEach(
                marker => {

                    const markerPosition =
                        marker.getLatLng();


                    if (
                        markerPosition.lat === lat &&
                        markerPosition.lng === lng
                    ) {

                        marker.openPopup();

                    }

                }
            );

        }

    </script>

</body>

</html>
